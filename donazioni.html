<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8"/>
    <title>Donazioni | Galaxy World</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/tw-build.css"/>

    <style>
        :root {
            --galaxy-accent: #8b5cf6;
            --galaxy-bg: #0f0a1e;
            --galaxy-glass: rgba(30, 20, 50, 0.7);
            --galaxy-glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--galaxy-bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 80%);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .vc-glass {
            background: var(--galaxy-glass);
            border: 1px solid var(--galaxy-glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .paypal-btn {
            background-color: #0070ba;
            transition: all 0.3s ease;
        }

        .paypal-btn:hover {
            background-color: #005ea6;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="antialiased">

    <div class="vc-glass max-w-lg w-full rounded-[3rem] p-12 text-center shadow-2xl">
        <a href="/" class="text-violet-400 font-bold uppercase tracking-widest mb-8 inline-block hover:text-white transition group">
            <span class="inline-block transition-transform group-hover:-translate-x-1">←</span> Torna alla Home
        </a>

        <h1 class="text-5xl font-black mb-6 text-white tracking-tight">Supportaci</h1>
        <p class="text-slate-300 mb-10 text-lg leading-relaxed">
            Il tuo contributo ci aiuta a mantenere il server attivo e a sviluppare nuove funzionalità per la community di Galaxy World.
        </p>

        <div class="space-y-4">
            <a href="https://paypal.me/giovannipasulo" target="_blank" class="paypal-btn block w-full py-6 text-white rounded-2xl font-bold text-xl shadow-lg">
                <i class="fa-brands fa-paypal mr-2"></i> Dona con PayPal
            </a>
        </div>

        <div class="mt-12 flex justify-center gap-4 grayscale opacity-50">
             <i class="fa-brands fa-cc-visa text-2xl"></i>
             <i class="fa-brands fa-cc-mastercard text-2xl"></i>
             <i class="fa-brands fa-cc-amex text-2xl"></i>
        </div>

        <p class="mt-8 text-sm text-slate-500 font-medium">Grazie per il tuo supporto!</p>
    </div>

</body>
</html>
